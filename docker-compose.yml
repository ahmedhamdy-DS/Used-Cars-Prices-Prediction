version: '3.8'

services:
  backend:
    build:
      context: .  
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - fullstack_network

  frontend:
    build:
      context: ./used-cars-ui 
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/predict 
    depends_on:
      - backend
    networks:
      - fullstack_network

networks:
  fullstack_network:
    driver: bridge